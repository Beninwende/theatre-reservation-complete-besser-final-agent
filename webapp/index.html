<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Theatre — Shows &amp; Reservations</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; max-width: 960px; }
    h1 { margin-top: 2rem; }
    table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
    th, td { border: 1px solid #ccc; padding: 0.5rem 0.75rem; text-align: left; }
    th { background: #f4f4f4; }
    .err { color: #b00020; }
    .hint { color: #555; font-size: 0.95rem; }
  </style>
</head>
<body>
  <h1>Small theatre</h1>
  <p class="hint">
    Companion to the BESSER WME project. API default:
    <code id="api-base"></code> — set <code>?api=http://127.0.0.1:8000</code> if needed.
    Chatbot: run <code>python theatre_bot.py</code>.
  </p>

  <h2>Shows</h2>
  <table id="shows-table">
    <thead>
      <tr>
        <th>Title</th>
        <th>When</th>
        <th>Price (€)</th>
        <th>Remaining</th>
        <th>PMR</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <h2>Reservations</h2>
  <table id="res-table">
    <thead>
      <tr>
        <th>Code</th>
        <th>Show</th>
        <th>Name</th>
        <th>Seats</th>
        <th>Zone</th>
        <th>Accessibility</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
  <p id="err" class="err"></p>

  <script>
    const params = new URLSearchParams(location.search);
    const API = (params.get("api") || "http://127.0.0.1:8000").replace(/\/$/, "");
    document.getElementById("api-base").textContent = API;

    async function load() {
      const err = document.getElementById("err");
      err.textContent = "";
      try {
        const [shows, reservations] = await Promise.all([
          fetch(API + "/shows").then((r) => r.json()),
          fetch(API + "/reservations").then((r) => r.json()),
        ]);
        const st = document.querySelector("#shows-table tbody");
        st.innerHTML = shows
          .map(
            (s) =>
              `<tr><td>${s.title}</td><td>${s.datetime}</td><td>${s.price_eur}</td>` +
              `<td>${s.remaining_seats}</td><td>${s.pmr_entrance || ""}</td></tr>`
          )
          .join("");
        const rt = document.querySelector("#res-table tbody");
        rt.innerHTML = reservations.length
          ? reservations
              .map(
                (b) =>
                  `<tr><td>${b.confirmation_code}</td><td>${b.show_id}</td>` +
                  `<td>${b.customer_name}</td><td>${b.seats}</td><td>${b.zone}</td>` +
                  `<td>${b.accessibility}</td></tr>`
              )
              .join("")
          : `<tr><td colspan="6">No bookings yet — use the chatbot (BOOK flow).</td></tr>`;
      } catch (e) {
        err.textContent =
          "Could not reach API at " + API + ". Start: THEATRE_PERSIST=1 uvicorn backend.main_api:app --port 8000";
      }
    }
    load();
    setInterval(load, 8000);
  </script>
</body>
</html>
