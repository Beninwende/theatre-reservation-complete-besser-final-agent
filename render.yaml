# Lab 6 — example Render blueprint (adjust repo URL and env vars).
services:
  - type: web
    name: theatre-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: uvicorn backend.main_api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: THEATRE_PERSIST
        value: "1"
      - key: THEATRE_DB
        value: /app/data/theatre.db
    healthCheckPath: /health
